<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>404 — Lost in latent space | Adarsh Singh</title>
<meta name="robots" content="noindex">
<link rel="icon" href="assets/favicon.svg">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&family=JetBrains+Mono:wght@400;500&family=Space+Grotesk:wght@400;500;700&display=swap" rel="stylesheet">
<style>
  /* self-contained 404 — works from any broken path */
  :root{--bg:#EDEEF1;--text:#0A1526;--muted:#57606E;--gold:#B98A2F;--line:rgba(10,21,38,.13);
    --mono:'JetBrains Mono',monospace;--sans:'Space Grotesk',sans-serif;--serif:'Instrument Serif',serif}
  *{box-sizing:border-box;margin:0;padding:0}
  html,body{height:100%}
  body{background:var(--bg);color:var(--text);font-family:var(--sans);display:flex;align-items:center;justify-content:center;padding:24px;overflow-x:hidden}
  .wrap{max-width:640px;text-align:center;position:relative;z-index:2}
  .fig{font-family:var(--mono);font-size:.72rem;letter-spacing:.3em;text-transform:uppercase;color:var(--muted);display:flex;align-items:center;gap:12px;justify-content:center;margin-bottom:26px}
  .fig .dot{width:7px;height:7px;border-radius:50%;background:var(--gold)}
  .fig hr{width:64px;border:0;border-top:1px solid var(--line)}
  .code{font-family:var(--serif);font-size:clamp(88px,20vw,168px);line-height:.9;letter-spacing:.01em}
  .code em{font-style:normal;color:var(--gold)}
  h1{font-family:var(--sans);font-weight:700;font-size:clamp(1.45rem,4.6vw,2.15rem);letter-spacing:-.02em;margin:18px 0 10px}
  p{color:var(--muted);font-size:.98rem;line-height:1.75;max-width:46ch;margin:0 auto 30px}
  p code{font-family:var(--mono);font-size:.82em;background:rgba(10,21,38,.06);padding:.18em .5em;border-radius:6px;color:var(--text)}
  .btns{display:flex;gap:11px;justify-content:center;flex-wrap:wrap}
  .btn{display:inline-flex;align-items:center;gap:.5rem;padding:.92rem 1.65rem;border-radius:99px;background:#0A1526;color:#F7F8FA;font-weight:600;font-size:.92rem;text-decoration:none;box-shadow:0 10px 30px rgba(10,21,38,.18);transition:transform .25s,box-shadow .25s}
  .btn:hover{transform:translateY(-2px);box-shadow:0 16px 40px rgba(185,138,47,.32)}
  .btn.ghost{background:transparent;color:var(--text);border:1px solid rgba(10,21,38,.28);box-shadow:none}
  .foot{margin-top:44px;font-family:var(--mono);font-size:.66rem;letter-spacing:.22em;text-transform:uppercase;color:var(--muted)}
  .foot a{color:var(--text);text-decoration:none;border-bottom:1px solid var(--gold)}
  /* drifting sparkles — the wand's lost trail */
  .spark{position:fixed;pointer-events:none;color:var(--gold);opacity:0;animation:drift linear infinite}
  @keyframes drift{
    0%{opacity:0;transform:translateY(16px) scale(.4) rotate(0deg)}
    25%{opacity:.75}
    100%{opacity:0;transform:translateY(-90px) scale(.9) rotate(110deg)}
  }
  @media(prefers-reduced-motion:reduce){.spark{display:none}}
</style>
</head>
<body>
<div class="wrap">
  <div class="fig"><hr><span class="dot"></span>FIG. 404 — NULL POINTER<hr></div>
  <div class="code">4<em>0</em>4</div>
  <h1>Lost in latent space.</h1>
  <p>This URL has no neighbors in any embedding — the page you're looking for was
    pruned, renamed, or never trained. Even a well-behaved model 404s sometimes.</p>
  <div class="btns">
    <a class="btn" href="https://iam-dev-Adarsh.github.io/portfolio/">Return to base →</a>
    <a class="btn ghost" href="https://iam-dev-Adarsh.github.io/portfolio/resume.html">View the resume</a>
  </div>
  <div class="foot">Adarsh Singh — <a href="https://github.com/iam-dev-Adarsh">AI/ML engineer</a> · no black boxes were harmed</div>
</div>
<script>
  /* a few sparkles from the wand that got lost here */
  (function () {
    if (matchMedia("(prefers-reduced-motion: reduce)").matches) return;
    var P = '<svg viewBox="0 0 24 24" width="100%" height="100%"><path d="M12 0c1.1 8.3 2.6 10.9 12 12-9.4 1.1-10.9 3.7-12 12-1.1-8.3-2.6-10.9-12-12 9.4-1.1 10.9-3.7 12-12z" fill="currentColor"/></svg>';
    for (var i = 0; i < 7; i++) {
      var s = document.createElement("div");
      s.className = "spark";
      var size = 7 + Math.random() * 12;
      s.style.cssText = "left:" + (5 + Math.random() * 90) + "vw;top:" + (12 + Math.random() * 76) + "vh;width:" + size + "px;height:" + size + "px;animation-duration:" + (5 + Math.random() * 6) + "s;animation-delay:" + (Math.random() * 5) + "s";
      s.innerHTML = P;
      document.body.appendChild(s);
    }
  })();
</script>
</body>
</html>
