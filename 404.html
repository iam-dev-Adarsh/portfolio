<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>404 — Lost in latent space | Adarsh Singh</title>
<meta name="robots" content="noindex">
<link rel="icon" href="assets/favicon.svg">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Archivo:wght@600;800;900&family=Fraunces:ital,wght@1,600&family=IBM+Plex+Mono:wght@500;600&display=swap" rel="stylesheet">
<style>
  /* self-contained 404 — works from any broken path */
  :root{--canvas:#F2F0EB;--ink:#17141B;--yellow:#FFD233;--orange:#E8762F;--blue:#2D7FF9;--magenta:#E5297F}
  *{box-sizing:border-box;margin:0;padding:0}
  html,body{height:100%}
  body{background:var(--canvas);color:var(--ink);font-family:'IBM Plex Mono',monospace;display:flex;align-items:center;justify-content:center;padding:24px;overflow:hidden;position:relative}
  .sh{position:absolute;border-radius:999px;pointer-events:none}
  .sun{width:340px;height:340px;background:var(--yellow);top:-120px;right:-90px}
  .pill{width:300px;height:64px;background:var(--magenta);bottom:12%;left:-70px;transform:rotate(-8deg)}
  .dot{width:170px;height:170px;background:var(--blue);bottom:-60px;right:12%}
  .ring{width:130px;height:130px;border:16px solid var(--ink);top:14%;left:12%;background:transparent}
  .wrap{max-width:680px;text-align:center;position:relative;z-index:2}
  .fig{font-size:.72rem;letter-spacing:.3em;text-transform:uppercase;opacity:.7;margin-bottom:26px}
  h1{font:900 clamp(2.6rem,8vw,4.6rem)/1 'Archivo',sans-serif;letter-spacing:-.03em;text-transform:uppercase}
  h1 em{font-family:'Fraunces',serif;font-style:italic;font-weight:600;text-transform:none;color:var(--magenta)}
  .sub{margin:26px auto 34px;font-size:.95rem;line-height:1.7;max-width:44ch;opacity:.85}
  .go{display:inline-block;font:700 .82rem/1 'IBM Plex Mono',monospace;letter-spacing:.14em;text-transform:uppercase;color:var(--ink);text-decoration:none;border:2.5px solid var(--ink);border-radius:999px;padding:17px 30px;transition:.18s}
  .go:hover{background:var(--ink);color:var(--canvas);transform:translateX(5px)}
</style>
</head>
<body>
  <div class="sh sun"></div>
  <div class="sh pill"></div>
  <div class="sh dot"></div>
  <div class="sh ring"></div>
  <main class="wrap">
    <div class="fig">FIG. 404 — THE WRONG TURN</div>
    <h1>Lost in<br><em>latent space.</em></h1>
    <p class="sub">The page you're looking for never made it out of training. No hard feelings — the exhibition is one click away.</p>
    <a class="go" href="https://iam-dev-Adarsh.github.io/portfolio/">Back to the exhibition →</a>
  </main>
</body>
</html>
